<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- maximum-scale/user-scalable pin the page at 1x: stops double-tap zoom
         and iOS's auto-zoom when focusing an input smaller than 16px. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>LIFFTO — Create QR</title>
    <script>
      try {
        if (localStorage.getItem('liffto.theme') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Inline on purpose. The stylesheet and the app bundle both arrive over
         the network, and until they do the page has no background of its own
         and #root is empty — so the first thing a visitor sees is the
         browser's white page. On a fast link that is a blink; on mobile data
         it is seconds of blank screen. These rules ship inside the HTML, so
         the first frame is already the app's own canvas with something on it.
         Values mirror --c-canvas / --c-ink-faint in index.css. -->
    <style>
      :root {
        --boot-bg: #f4f5f7;
        --boot-fg: #9ca3af;
        --boot-accent: #1b59f5;
      }
      html.dark {
        --boot-bg: #0f1216;
        --boot-fg: #6b727c;
      }
      html,
      body {
        margin: 0;
        background: var(--boot-bg);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
      }
      #boot i {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        border: 2px solid var(--boot-accent);
        border-top-color: transparent;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot p {
        margin: 0;
        font-size: 13px;
        color: var(--boot-fg);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <!-- Replaced by React on mount. Lives inside #root so it cannot outlive
         the app: createRoot discards whatever the container already held. -->
    <div id="root">
      <div id="boot">
        <i></i>
        <p>Loading…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
